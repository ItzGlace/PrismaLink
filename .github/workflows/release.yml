name: Native prerelease
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: rustup show
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: npm run build
      - run: npm test
      - run: cargo test -p prismalink-core --locked
      - run: cargo fmt --all -- --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: rustup show
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64 rpm xvfb dbus-x11 python3-pyatspi
      - run: npm ci
      - run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - if: runner.os == 'Linux'
        run: |
          sudo dpkg -i target/release/bundle/deb/*.deb
          test -x /usr/bin/prismalink
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/smoke-linux.py /usr/bin/prismalink
          sudo dpkg -r prisma-link
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate protected Android signing requirements
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing protected GitHub Actions secret: $name. Configure it in the release environment; do not send its value in chat."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - run: rustup show
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: npm ci
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'
          printf 'NDK_HOME=%s/ndk/27.2.12479018\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - run: npm run tauri android build -- --ci --apk --target aarch64 armv7 x86_64
      - name: Sign with the existing release key and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android signing key. Configure protected release secrets; no replacement key is generated.'; exit 1; }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*unsigned.apk' -o -name '*release-unsigned.apk' | head -1)
          test -n "$APK"
          mkdir -p release
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/PrismaLink-universal.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose release/PrismaLink-universal.apk
      - name: Enable runner KVM
        run: |
          test -e /dev/kvm || { echo 'Android emulator requires a KVM-capable runner'; exit 1; }
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r release/PrismaLink-universal.apk
            python3 scripts/smoke-android.py
            adb uninstall com.prismalink.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android, path: release/*.apk, if-no-files-found: error }
  publish:
    if: github.ref_type == 'tag'
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: artifacts, merge-multiple: true }
      - run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp '{}' release/ \;
          python3 scripts/check-assets.py release
          git archive --format=tar.gz --prefix=PrismaLink/ -o "release/PrismaLink-${GITHUB_REF_NAME}-source.tar.gz" "$GITHUB_SHA"
          npm ci
          npm sbom --sbom-format cyclonedx > release/frontend-sbom.cdx.json
          cargo metadata --locked --format-version 1 > release/rust-dependencies.json
          python3 scripts/rust-licenses.py release/rust-license-notices
          tar -czf release/rust-license-notices.tar.gz -C release rust-license-notices
          rm -rf release/rust-license-notices
          node scripts/licenses.mjs > release/frontend-licenses.json
          python3 scripts/release-manifest.py release
      - name: Publish and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "PrismaLink $GITHUB_REF_NAME · Alpha" --notes-file docs/RELEASE_NOTES.md
          gh release view "$GITHUB_REF_NAME" --json url,assets,tagName,targetCommitish > release/verified-release.json
          python3 - <<'PY'
          import json, pathlib
          r=json.load(open('release/verified-release.json'))
          expected=json.load(open('release/provenance.json'))['assets']
          actual={a['name']:a for a in r['assets']}
          for a in expected:
              assert actual[a['name']]['size']==a['bytes'], a['name']
              assert actual[a['name']]['url'].startswith('https://github.com/'), a['name']
          print(r['url'])
          PY
          mkdir -p verified-downloads
          gh release download "$GITHUB_REF_NAME" --dir verified-downloads
          (cd verified-downloads && sha256sum -c SHA256SUMS)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .html_url
