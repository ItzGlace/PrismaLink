name: Inspect Android smoke failure
on:
  push:
    branches: ["release/inspect-android"]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: android-failure-diagnostics
          run-id: 44761582314
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Report non-secret emulator UI state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          root=ET.parse('diagnostics/android-failure.xml').getroot()
          texts=[]
          for node in root.iter('node'):
              if node.get('password')=='true':
                  texts.append({'password_field':True,'bounds':node.get('bounds'),'text_length':len(node.get('text','')),'focused':node.get('focused')})
                  continue
              for key in ('text','content-desc'):
                  value=node.get(key,'').replace('prismalink-ci-disposable-2026','[redacted-test-password]')
                  if value:texts.append({'label':value,'bounds':node.get('bounds'),'clickable':node.get('clickable'),'class':node.get('class')})
          message=json.dumps(texts,ensure_ascii=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice::Emulator UI state: '+message)
          PY
